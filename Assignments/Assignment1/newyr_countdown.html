<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Year Countdown</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at 20% 20%, #312e81, transparent 30%),
                radial-gradient(circle at 80% 80%, #581c87, transparent 30%),
                #020617;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 1000px;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
            font-size: 13px;
            letter-spacing: 2px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 90px);
            line-height: 1;
            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #c4b5fd,
                #93c5fd
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 45px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .time-box {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);

            border-radius: 22px;
            padding: 30px 15px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);

            transition: 0.3s;
        }

        .time-box:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.12);
        }

        .number {
            display: block;
            font-size: clamp(40px, 6vw, 70px);
            font-weight: 800;
        }

        .label {
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            margin-top: 10px;
        }

        #message {
            margin-top: 35px;
            font-size: 25px;
            font-weight: 600;
        }

        @media(max-width: 650px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }

            .time-box {
                padding: 22px 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="badge">
        ✦ COUNTDOWN TIMER ✦
    </div>

    <h1 id="year">NEW YEAR</h1>

    <p class="subtitle">
        A new beginning is just around the corner
    </p>

    <div class="countdown">

        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Days</span>
        </div>

        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Hours</span>
        </div>

        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Minutes</span>
        </div>

        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Seconds</span>
        </div>

    </div>

    <div id="message"></div>

</div>


<script>

function updateCountdown() {

    const now = new Date();

    const currentYear = now.getFullYear();

    // Target = January 1 of the next year
    const newYear = new Date(currentYear + 1, 0, 1, 0, 0, 0);

    const difference = newYear - now;

    // Convert milliseconds
    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (difference / 1000) % 60
    );

    document.getElementById("days").innerText =
        String(days).padStart(2, "0");

    document.getElementById("hours").innerText =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").innerText =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").innerText =
        String(seconds).padStart(2, "0");

    document.getElementById("year").innerText =
        "NEW YEAR " + (currentYear + 1);

    // When countdown reaches zero
    if (difference <= 0) {

        document.getElementById("message").innerText =
            "🎉 Happy New Year! 🎉";

        clearInterval(timer);
    }
}

// Update immediately
updateCountdown();

// Update every second
const timer = setInterval(updateCountdown, 1000);

</script>

</body>
</html>
