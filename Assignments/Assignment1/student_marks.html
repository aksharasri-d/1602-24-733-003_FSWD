<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #f8fafc;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e3a8a;
            font-size: 36px;
        }

        .header p {
            color: #64748b;
            margin-top: 8px;
        }

        .card {
            background: rgba(255,255,255,0.96);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(15,23,42,0.15);
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input {
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.25s;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79,70,229,0.3);
        }

        #error {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e2e8f0;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .result-box {
            padding: 20px;
            border-radius: 15px;
            background: #f8fafc;
            text-align: center;
        }

        .result-box h3 {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .result-box p {
            font-size: 25px;
            font-weight: 800;
            color: #1e3a8a;
        }

        .pass {
            background: #dcfce7;
        }

        .pass p {
            color: #15803d;
        }

        .fail {
            background: #fee2e2;
        }

        .fail p {
            color: #dc2626;
        }

        @media(max-width: 650px) {
            .subjects,
            .result-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="header">
        <h1>Student Result Calculator</h1>
        <p>Enter marks to calculate academic performance</p>
    </div>

    <div class="card">

        <div class="subjects">

            <div class="input-group">
                <label>Web Technology</label>
                <input type="number" id="web" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="input-group">
                <label>Data Structures</label>
                <input type="number" id="ds" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="input-group">
                <label>Database Management</label>
                <input type="number" id="dbms" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="input-group">
                <label>Operating Systems</label>
                <input type="number" id="os" min="0" max="100" placeholder="0 - 100">
            </div>

        </div>

        <button onclick="calculateResult()">
            Calculate Result
        </button>

        <div id="error"></div>

        <div id="result">

            <div class="result-grid">

                <div class="result-box">
                    <h3>Total Marks</h3>
                    <p id="total">0</p>
                </div>

                <div class="result-box">
                    <h3>Percentage</h3>
                    <p id="percentage">0%</p>
                </div>

                <div class="result-box">
                    <h3>Grade</h3>
                    <p id="grade">-</p>
                </div>

                <div class="result-box" id="resultBox">
                    <h3>Result</h3>
                    <p id="resultText">-</p>
                </div>

            </div>

        </div>

    </div>

</div>


<script>

function calculateResult() {

    const marks = [
        Number(document.getElementById("web").value),
        Number(document.getElementById("ds").value),
        Number(document.getElementById("dbms").value),
        Number(document.getElementById("os").value)
    ];

    const error = document.getElementById("error");

    // Validate input
    if (marks.some(mark => isNaN(mark) || mark < 0 || mark > 100)) {

        error.style.display = "block";

        error.innerText =
            "Invalid input! Please enter marks between 0 and 100 for every subject.";

        document.getElementById("result").style.display = "none";

        return;
    }

    error.style.display = "none";

    // Calculate total
    const total = marks.reduce((sum, mark) => sum + mark, 0);

    // Calculate percentage
    const percentage = total / marks.length;

    // Calculate grade
    let grade;

    if (percentage >= 90) {
        grade = "A+";
    }
    else if (percentage >= 80) {
        grade = "A";
    }
    else if (percentage >= 70) {
        grade = "B";
    }
    else if (percentage >= 60) {
        grade = "C";
    }
    else if (percentage >= 50) {
        grade = "D";
    }
    else {
        grade = "F";
    }

    // Result
    const passed = marks.every(mark => mark >= 40);

    document.getElementById("total").innerText = total;

    document.getElementById("percentage").innerText =
        percentage.toFixed(2) + "%";

    document.getElementById("grade").innerText = grade;

    document.getElementById("resultText").innerText =
        passed ? "PASS" : "FAIL";

    const resultBox = document.getElementById("resultBox");

    resultBox.classList.remove("pass", "fail");

    resultBox.classList.add(
        passed ? "pass" : "fail"
    );

    document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
